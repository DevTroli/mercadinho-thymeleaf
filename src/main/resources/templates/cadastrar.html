<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
    <title>Cadastrar Produto</title>
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Cadastrar Produto</h1>

    <!-- Mensagem de erro enviada pelo controller (validacao do preco) -->
    <div class="alert alert-danger" role="alert" th:if="${erro}" th:text="${erro}">
        Erro
    </div>

    <form th:action="@{/cadastrar}" th:object="${produto}" method="post">
        <div class="form-group">
            <label for="nome">Nome</label>
            <input class="form-control" type="text" th:field="*{nome}"
                   placeholder="Ex: Camiseta, Notebook..." required />
        </div>
        <div class="form-group">
            <label for="preco">Preço (R$)</label>
            <input class="form-control" type="number" th:field="*{preco}"
                   step="0.01" placeholder="Ex: 49.90" required />
        </div>
        <div class="form-group">
            <label for="categoria">Categoria</label>
            <!-- th:each gera uma <option> para cada categoria da lista fixa -->
            <select class="form-control" th:field="*{categoria}" required>
                <option value="">Selecione...</option>
                <option th:each="cat : ${categorias}" th:value="${cat}" th:text="${cat}">Categoria</option>
            </select>
        </div>
        <div class="form-group">
            <label for="estoque">Estoque (unidades)</label>
            <input class="form-control" type="number" th:field="*{estoque}"
                   min="0" step="1" placeholder="Ex: 10" required />
        </div>
        <button class="btn btn-primary" type="submit">Cadastrar</button>
    </form>

    <a th:href="@{/lista}" class="btn btn-secondary mt-3">Ver lista de produtos</a>
</div>
</body>
</html>
