<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
    <title>Lista de Produtos</title>
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Lista de Produtos</h1>

    <div class="card">
        <div class="card-body">
            <!-- Busca por nome ou categoria: GET /lista?busca=... -->
            <form class="form-inline mb-3" th:action="@{/lista}" method="get">
                <input class="form-control mr-2" type="text" name="busca" th:value="${busca}"
                       placeholder="Buscar por nome ou categoria" />
                <button class="btn btn-primary mr-2" type="submit">Buscar</button>
                <a th:href="@{/lista}" class="btn btn-secondary" th:if="${busca != null and !#strings.isEmpty(busca)}">Limpar</a>
            </form>

            <!-- th:if -> exibe o bloco somente se a lista estiver vazia -->
            <div class="alert alert-info" role="alert" th:if="${#lists.isEmpty(produtos)}">
                <span th:if="${busca != null and !#strings.isEmpty(busca)}"
                      th:text="'Nenhum produto encontrado para: ' + ${busca}"></span>
                <span th:unless="${busca != null and !#strings.isEmpty(busca)}">Nenhum produto cadastrado ainda.</span>
            </div>

            <!-- th:unless -> exibe a tabela somente quando ha produtos -->
            <table class="table table-striped" th:unless="${#lists.isEmpty(produtos)}">
                <thead class="thead-dark">
                <tr>
                    <th>#</th>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Categoria</th>
                    <th>Estoque</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <!-- th:each -> uma linha para cada produto; iterStat traz o indice -->
                <tr th:each="produto, iterStat : ${produtos}">
                    <td th:text="${iterStat.count}">1</td>
                    <td th:text="${produto.nome}">Nome</td>
                    <td th:text="'R$ ' + ${#numbers.formatDecimal(produto.preco, 1, 2)}">0,00</td>
                    <td th:text="${produto.categoria}">Categoria</td>
                    <td th:text="${produto.estoque}">0</td>
                    <td>
                        <!-- POST /remover/{id}: remove pelo identificador do produto -->
                        <form th:action="@{/remover/{id}(id=${produto.id})}" method="post"
                              class="form-remover"
                              onsubmit="return confirm('Remover este produto?');">
                            <button type="submit" class="btn btn-sm btn-danger">Remover</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <p class="text-muted" th:unless="${#lists.isEmpty(produtos)}"
               th:text="${produtos.size()} + ' produto(s) encontrado(s)'"></p>

            <a th:href="@{/cadastrar}" class="btn btn-primary">+ Cadastrar novo produto</a>
        </div>
    </div>
</div>
</body>
</html>
