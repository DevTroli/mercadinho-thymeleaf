spring.application.name=mercadinho-thymeleaf

# Redirecionamentos corretos atras de proxy (ex.: Codespaces, que expoe a porta 8080 em outro dominio)
server.forward-headers-strategy=framework
server.tomcat.use-relative-redirects=true

# Banco H2 embarcado, em memoria: os dados somem quando o servidor reinicia
spring.datasource.url=jdbc:h2:mem:mercadinho
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Console web do H2 em /h2-console (apenas para estudo)
spring.h2.console.enabled=true
